version: '3.8'

services:
  online-shop-app:
    build:
      context: .
      dockerfile: Dockerfile
      container_name: online_app
    ports:
      - "3000:5173"      # Map container port 5173 to host port 3000
    restart: always    
    healthcheck:
      test: ["cmd", "curl", "-f", "http://localhost:3000/"]
      interval: 60s
      timeout: 10s
      retries: 5
      networks:
        - online_shop


      networks:
        online_shop:
          driver: bridge


